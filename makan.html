<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pertanyaan</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffe6f0;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,.15);
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #d63384;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>💌 Pertanyaan</h2>

  <p>Kamu sudah makan belum?</p>

  <input
    type="text"
    id="jawaban"
    placeholder="Tulis jawabanmu..."
  >

  <button onclick="kirimEmail()">
    Kirim Jawaban
  </button>

</div>

<script>

function kirimEmail() {

  const jawaban =
    document.getElementById("jawaban").value;

  if (jawaban.trim() === "") {
    alert("Tulis jawaban dulu ya 😊");
    return;
  }

  const emailTujuan = "pendukungpastragmail.com";

  const subjek = "Jawaban dari Website";

  const isi =
    "Pertanyaan: Kamu sudah makan belum?%0A%0A" +
    "Jawaban: " +
    encodeURIComponent(jawaban);

  window.location.href =
    "mailto:" +
    emailTujuan +
    "?subject=" +
    encodeURIComponent(subjek) +
    "&body=" +
    isi;
}

</script>

</body>
</html>
